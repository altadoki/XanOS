<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#242426">
  <title>XanOS Desktop</title>
  <link rel="stylesheet" href="desktop.css">
  <script src="desktop.js" defer></script>
</head>
<body>
  <main class="desktop" aria-label="XanOS desktop"></main>

  <footer class="taskbar">
    <button class="start-button" type="button" aria-label="XanOS Start" title="XanOS">
      <img src="RootIcons/Xanossmall.png" alt="XanOS" class="os-logo">
    </button>
    <div class="taskbar-space"></div>
    <div class="system-tray">
      <span id="clock" class="clock" aria-label="Current local time" aria-live="off">--:--</span>
    </div>
  </footer>
</body>
</html>
